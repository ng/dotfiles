# Bind C-o since emacs uses C-a and C-b
set -g prefix C-o

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

######################
### DESIGN CHANGES ###
######################

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# modes
setw -g clock-mode-colour '#5fafaf'
setw -g mode-style 'fg=#1a1a2e bg=#5fafaf bold'

# panes
set -g pane-border-style 'fg=#3a3a3a'
set -g pane-active-border-style 'fg=#5fafaf'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#2e2e2e fg=#a0a0a0'
set -g status-left '#[fg=#1a1a2e,bg=#5fafaf,bold] #S #[default] '
set -g status-right '#[fg=#5fafaf]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD) #[fg=#606060]%H:%M '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style 'fg=#ffffff bg=#444444 bold'
setw -g window-status-current-format ' #I:#W#F '

setw -g window-status-style 'fg=#808080 bg=#2e2e2e'
setw -g window-status-format ' #I:#W#F '

setw -g window-status-bell-style 'fg=#ffffff bg=#e06c75 bold'

# messages
set -g message-style 'fg=#2e2e2e bg=#e5c07b bold'

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Renumber windows automatically
set-option -g renumber-windows on

# Mouse mode!
set -g mouse on

# Copy mode — vi keys, clipboard integration
# Use prefix+[ to enter copy mode (respects pane boundaries unlike terminal select)
# v to start selection, y to yank to system clipboard, Escape to cancel
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Reload tmux.conf
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
